# Standalone production compose file — pulls prebuilt images from Docker Hub.
# Does NOT need the source repo on the server, only this file plus the three
# .env files (backend/.env, agent-service/.env, frontend/.env.local if used).
#
# Usage on the server:
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#   docker compose -f docker-compose.deploy.yml logs -f backend

services:
  backend:
    image: gam5510/marketscout-backend:latest
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - marketscout
    restart: always

  agent-service:
    image: gam5510/marketscout-agent-service:latest
    expose:
      - "8001"
    env_file:
      - ./agent-service/.env
    # NOTE: must stay single-worker — research job state (_jobs) lives in
    # in-process memory (router.py), so extra workers would 404 on
    # /research/{id}/stream or /history since the job may live on another process.
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - marketscout
    restart: always

  frontend:
    image: gam5510/marketscout-frontend:latest
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks:
      - marketscout
    restart: always

networks:
  marketscout:
    driver: bridge
